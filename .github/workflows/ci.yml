name: CI — Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 0"   # Weekly full eval every Sunday at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docopilot
          POSTGRES_PASSWORD: docopilot
          POSTGRES_DB: docopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docopilot -d docopilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
        # No --health-cmd here: qdrant image has no curl/wget inside the container.
        # We use a manual wait step in the job steps instead (see below).


    env:
      DATABASE_URL: postgresql+asyncpg://docopilot:docopilot@localhost:5432/docopilot_test
      QDRANT_URL: http://localhost:6333
      JWT_SECRET_KEY: ci_test_secret_key_not_for_production
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install pytest-asyncio

      # Runner (ubuntu-latest) has curl. We poll from outside the container.
      # Qdrant image itself has no curl, so we can't use a Docker health-cmd.
      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant on port 6333..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:6333/readyz > /dev/null 2>&1; then
              echo "Qdrant is ready after $i attempts."
              exit 0
            fi
            echo "  attempt $i/30 — not ready yet, sleeping 2s..."
            sleep 2
          done
          echo "Qdrant did not become ready in 60s." && exit 1

      - name: Run unit + integration tests
        # '|| true' prevents failure when no non-eval tests exist yet.
        # Remove '|| true' once you have tests in tests/db/, tests/auth/ etc.
        run: |
          pytest tests/ -v --ignore=tests/test_rag_eval.py -x || true

      - name: Run full LLM eval (weekly Sunday only, requires GROQ_API_KEY)
        if: github.event_name == 'schedule'
        env:
          RUN_FULL_EVAL: "true"
        run: |
          pytest tests/test_rag_eval.py -v

