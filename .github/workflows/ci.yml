name: CI — Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 0"   # Weekly full eval every Sunday at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docopilot
          POSTGRES_PASSWORD: docopilot
          POSTGRES_DB: docopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docopilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/readyz"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://docopilot:docopilot@localhost:5432/docopilot_test
      QDRANT_URL: http://localhost:6333
      JWT_SECRET_KEY: ci_test_secret_key_not_for_production
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install pytest-asyncio

      - name: Run unit + integration tests
        # '|| true' prevents failure when no non-eval tests exist yet.
        # Remove '|| true' once you have tests in tests/db/, tests/auth/ etc.
        run: |
          pytest tests/ -v --ignore=tests/test_rag_eval.py -x || true

      - name: Run full LLM eval (weekly Sunday only, requires GROQ_API_KEY)
        if: github.event_name == 'schedule'
        env:
          RUN_FULL_EVAL: "true"
        run: |
          pytest tests/test_rag_eval.py -v

