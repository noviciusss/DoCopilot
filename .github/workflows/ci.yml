name: CI — Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docopilot
          POSTGRES_PASSWORD: docopilot
          POSTGRES_DB: docopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docopilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/readyz"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://docopilot:docopilot@localhost:5432/docopilot_test
      QDRANT_URL: http://localhost:6333
      JWT_SECRET_KEY: ci_test_secret_key_not_for_production
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run tests (unit + integration, no LLM cost)
        run: |
          pytest tests/ -v --ignore=tests/test_rag_eval.py -x

      - name: Run LLM eval (weekly / full, requires GROQ_API_KEY)
        if: ${{ github.event_name == 'schedule' || env.RUN_FULL_EVAL == 'true' }}
        env:
          RUN_FULL_EVAL: "true"
        run: |
          pytest tests/test_rag_eval.py -v
