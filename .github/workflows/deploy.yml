name: Deploy — Production

on:
  push:
    branches: ["main"]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # az acr build (ACR Tasks) is blocked on Azure for Students.
      # Instead: log into ACR with docker, build locally on the runner, then push.
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image (local runner build)
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/docopilot-backend:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/docopilot-backend:latest \
            .

      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/docopilot-backend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/docopilot-backend:latest

      - name: Deploy new image to Azure Container Apps
        run: |
          az containerapp update \
            --name docopilot-backend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/docopilot-backend:${{ github.sha }}

      # Purge old images from ACR — keeps only the 3 most recent.
      # ACR Basic SKU charges ~$0.10/GB/month. Old layers accumulate fast.
      - name: Purge old ACR images (keep last 3)
        run: |
          az acr run \
            --registry ${{ secrets.ACR_NAME }} \
            --cmd "acr purge --filter 'docopilot-backend:.*' --ago 7d --keep 3 --untagged" \
            /dev/null || true


  deploy-frontend:
    runs-on: ubuntu-latest
    # Only runs when Vercel secrets are configured.
    # Set these in: GitHub Repo → Settings → Secrets → Actions
    if: ${{ secrets.VERCEL_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: "--prod"

